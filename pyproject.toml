[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mimicanno"
version = "0.1.0"
description = "Robot-episode subtask annotation pipeline."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyarrow>=15",
  "pyyaml>=6.0",
  "typer>=0.12",
  "jsonschema>=4.21",
  "imageio-ffmpeg>=0.4.9",
]

[project.scripts]
mimicanno = "mimicanno.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.5",
  "pytest-timeout>=2.3",
  "ruff>=0.4",
  "mypy>=1.10",
]
vlm = [
  "huggingface_hub>=0.30",
  # Phase 2 VLM (Gemma 4) — VLM compat verified on transformers 5.6.2
  # (see docs/superpowers/notes/2026-05-04-vlm-transformers-compat.md).
  "transformers>=5.5,<6",
  "Pillow>=10",
]
sam3 = [
  # SAM3 backend uses sam3/ submodule native API (build_sam3_video_predictor).
  # transformers Sam3* extras are NOT required (replaced 2026-05-04). Keep
  # transformers in this extra purely for sharing the Phase 2 VLM env.
  "transformers>=5.5,<6",
  "Pillow>=10",
  "torch>=2.4",
  "torchvision>=0.19",
  "huggingface_hub>=0.30",
  # sam3 submodule itself + its undeclared runtime deps.
  "sam3",
  "einops>=0.8",
  "opencv-python>=4.8",
  "av>=12",
  "pycocotools>=2.0.8",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "psutil>=5.9",
  "timm>=1.0",
  "iopath>=0.1.10",
  "ftfy>=6.1",
  # numpy<2 enforced by sam3 (timm + sam3.train.data internals).
  "numpy>=1.26,<2",
]

[tool.uv.sources]
# Local sam3 git submodule (gayagayataiga/sam3 personal fork). Editable so that
# changes to sam3/ during development don't require a re-install. PyPI has an
# unrelated `sam3` package — without this source override, `uv sync --extra sam3`
# would pull that one and break import paths.
sam3 = { path = "sam3", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["mimicanno"]

[tool.hatch.build.targets.wheel.force-include]
"mimicanno/configs/labels/manipulation.yaml" = "mimicanno/configs/labels/manipulation.yaml"
"mimicanno/jsonschemas/manifest.schema.json" = "mimicanno/jsonschemas/manifest.schema.json"
"mimicanno/jsonschemas/annotation.schema.json" = "mimicanno/jsonschemas/annotation.schema.json"
"mimicanno/jsonschemas/boundaries.schema.json" = "mimicanno/jsonschemas/boundaries.schema.json"
"mimicanno/jsonschemas/signals.schema.json" = "mimicanno/jsonschemas/signals.schema.json"
"mimicanno/jsonschemas/export_profile.schema.json" = "mimicanno/jsonschemas/export_profile.schema.json"
"mimicanno/jsonschemas/export_manifest.schema.json" = "mimicanno/jsonschemas/export_manifest.schema.json"
"mimicanno/jsonschemas/mimicanno_segments.schema.json" = "mimicanno/jsonschemas/mimicanno_segments.schema.json"
"mimicanno/configs/exports/so101_sarm.yaml" = "mimicanno/configs/exports/so101_sarm.yaml"
"mimicanno/configs/exports/aloha_sarm.yaml" = "mimicanno/configs/exports/aloha_sarm.yaml"
"mimicanno/configs/exports/generic.yaml" = "mimicanno/configs/exports/generic.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: end-to-end CLI tests that touch the filesystem",
  "perf: performance regression tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["mimicanno"]

[[tool.mypy.overrides]]
module = [
  "huggingface_hub",
  "huggingface_hub.*",
  "transformers",
  "transformers.*",
  "torch",
  "torch.*",
  "torchvision",
  "torchvision.*",
  "PIL",
  "PIL.*",
]
ignore_missing_imports = true
